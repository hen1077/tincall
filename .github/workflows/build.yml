name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios-checks:
    name: Standalone iOS checks
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run production-source Swift checks
        run: python3 ios/Tests/run_checks.py --output "$RUNNER_TEMP/ios-checks"
      - name: Upload check results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-checks
          path: |
            ${{ runner.temp }}/ios-checks/*.log
            ${{ runner.temp }}/ios-checks/results.json
          retention-days: 7
      - name: Upload production deployment transactions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-deployment-transactions
          path: ${{ runner.temp }}/ios-checks/sql-transactions/*.sql
          if-no-files-found: error
          retention-days: 1
  ios-deployment-sql:
    name: iOS deployment SQL (PostgreSQL)
    needs: ios-checks
    if: ${{ always() && needs.ios-checks.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ios-deployment-transactions
          path: ${{ runner.temp }}/sql-transactions
      - name: Run exported production transactions
        run: python3 ios/Tests/SupabaseDeploymentSQLChecks.py "$RUNNER_TEMP/sql-transactions"
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Translated strings complete
        shell: python3 {0}
        run: |
          import json, pathlib, re, sys
          # Chinese source strings must ship in every UI language; otherwise those users see Simplified Chinese.
          missing = [f"{path} [{lang}]: {key[:60]}" for path in sorted(pathlib.Path("ios").rglob("*.xcstrings"))
                     for key, entry in json.loads(path.read_text(encoding="utf-8"))["strings"].items()
                     if re.search(r"[\u4e00-\u9fff]", key) and entry.get("shouldTranslate") is not False
                     and entry.get("extractionState") != "stale"
                     for lang in ("en", "ja", "ko", "zh-Hant") if lang not in entry.get("localizations", {})]
          print("\n".join(missing) or "All Chinese strings have en, ja, ko and zh-Hant.")
          sys.exit(1 if missing else 0)
      - name: Cloudflare tests
        run: node --test cloudflare/tests/*.test.mjs
      - name: Connector tests (SQLite)
        env:
          TINCALL_TEST_STORAGE: sqlite
        run: find connector/tests -maxdepth 1 -type f -name '*.test.mjs' ! -name 'install-local.test.mjs' -exec node --test {} +
      - name: Connector tests (PostgreSQL)
        env:
          TINCALL_TEST_STORAGE: postgres
        run: find connector/tests -maxdepth 1 -type f -name '*.test.mjs' ! -name 'install-local.test.mjs' -exec node --test {} +
  installer:
    name: Installer tests (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Installer tests
        run: node --test connector/tests/install-local.test.mjs
  build:
    name: Xcode ${{ matrix.xcode }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-26, xcode: "26.4" }
          - { runner: macos-26, xcode: "26.6" }
          - { runner: xcode-27, xcode: "27" }
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        shell: bash
        run: |
          ls -d /Applications/Xcode*.app
          expected='${{ matrix.xcode }}'
          shopt -s nullglob
          apps=(/Applications/Xcode_${expected}*.app)
          if (( ${#apps[@]} )); then
            app="${apps[${#apps[@]}-1]}"
          elif [[ "$expected" == 27 ]]; then
            app=/Applications/Xcode.app
          else
            echo "::error::Xcode $expected is not installed"
            exit 1
          fi
          sudo xcode-select -s "$app/Contents/Developer"
          version_output=$(xcodebuild -version)
          echo "$version_output"
          first_line=${version_output%%$'\n'*}
          version=${first_line#Xcode }
          if [[ "$version" != "$expected" && "$version" != "$expected".* ]]; then
            echo "::error::Expected Xcode $expected, got $first_line"
            exit 1
          fi
          xcodebuild -showsdks | grep -i iphoneos
      - name: Build for iOS device (no signing)
        shell: bash
        run: |
          if xcodebuild -project ios/Tincall.xcodeproj -scheme Tincall -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/build.log" 2>&1; then
            code=0
          else
            code=$?
          fi
          echo "=== errors ==="
          awk '/error:/ && !seen[$0]++ { if (count++ < 60) print }' "$RUNNER_TEMP/build.log"
          echo "=== tail ==="
          tail -15 "$RUNNER_TEMP/build.log"
          exit "$code"
      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-xcode-${{ matrix.xcode }}
          path: ${{ runner.temp }}/build.log
          retention-days: 7
  app-store:
    name: App Store edition (Xcode 27)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        shell: bash
        run: |
          ls -d /Applications/Xcode*.app
          shopt -s nullglob
          apps=(/Applications/Xcode_27*.app)
          if (( ${#apps[@]} )); then
            app="${apps[${#apps[@]}-1]}"
          else
            app=/Applications/Xcode.app
          fi
          sudo xcode-select -s "$app/Contents/Developer"
          version_output=$(xcodebuild -version)
          echo "$version_output"
          first_line=${version_output%%$'\n'*}
          version=${first_line#Xcode }
          if [[ "$version" != 27 && "$version" != 27.* ]]; then
            echo "::error::Expected Xcode 27, got $first_line"
            exit 1
          fi
          xcodebuild -showsdks | grep -i iphoneos
      - name: Build App Store edition for iOS device (no signing)
        shell: bash
        run: |
          if xcodebuild -project ios/Tincall.xcodeproj -scheme Tincall-AppStore -configuration StoreRelease \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/build.log" 2>&1; then
            code=0
          else
            code=$?
          fi
          echo "=== errors ==="
          awk '/error:/ && !seen[$0]++ { if (count++ < 60) print }' "$RUNNER_TEMP/build.log"
          echo "=== tail ==="
          tail -15 "$RUNNER_TEMP/build.log"
          exit "$code"
      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-app-store-xcode-27
          path: ${{ runner.temp }}/build.log
          retention-days: 7

  package-self-sign:
    name: Build unsigned self-sign IPA
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 27
        shell: bash
        run: |
          shopt -s nullglob
          apps=(/Applications/Xcode_27*.app)
          if (( ${#apps[@]} )); then
            app="${apps[${#apps[@]}-1]}"
          else
            app=/Applications/Xcode.app
          fi
          sudo xcode-select -s "$app/Contents/Developer"
          xcodebuild -version
      - name: Seed verified ONNX archives into SwiftPM cache
        shell: bash
        run: |
          set -euo pipefail
          mirror="https://github.com/TypeWhisper/onnxruntime-swift-package-manager/releases/download/1.24.2"
          cache="$HOME/Library/Caches/org.swift.swiftpm/artifacts"
          mkdir -p "$cache"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          seed() {
            original_url="$1"
            mirror_url="$2"
            checksum="$3"
            name="${original_url##*/}"
            target="$cache/$(printf '%s' "$original_url" | LC_ALL=C sed 's/[^A-Za-z0-9]/_/g')"

            curl -fsSL --retry 4 --retry-all-errors --connect-timeout 20 --max-time 300 \
              "$mirror_url" -o "$work/$name"
            echo "$checksum  $work/$name" | shasum -a 256 -c -
            mv "$work/$name" "$target"
          }

          seed \
            "https://download.onnxruntime.ai/pod-archive-onnxruntime-c-1.24.2.zip" \
            "$mirror/pod-archive-onnxruntime-c-1.24.2.zip" \
            "f7100a992d2a8135168c8afd831e6a58b465349101982aa58b3e11d36e600b54"

          seed \
            "https://download.onnxruntime.ai/pod-archive-onnxruntime-extensions-c-0.13.0.zip" \
            "$mirror/pod-archive-onnxruntime-extensions-c-0.13.0.zip" \
            "346522d1171d4c99cb0908fa8e4e9330a4a6aad39cd83ce36eb654437b33e6b5"
      - name: Package unsigned IPA
        shell: bash
        run: |
          if bash tools/package-self-sign.sh "$RUNNER_TEMP/tincall-selfsign"; then
            exit 0
          fi
          echo "=== package errors ==="
          awk '/error:/ && !seen[$0]++ { if (count++ < 80) print }' "$RUNNER_TEMP/tincall-selfsign/build.log" || true
          echo "=== package log tail ==="
          tail -40 "$RUNNER_TEMP/tincall-selfsign/build.log" || true
          exit 1
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: tincall-bilingual-selfsign
          path: |
            ${{ runner.temp }}/tincall-selfsign/*-selfsign-unsigned.ipa
            ${{ runner.temp }}/tincall-selfsign/*-library-materials.zip
            ${{ runner.temp }}/tincall-selfsign/BUILD.txt
          if-no-files-found: error
          retention-days: 7
